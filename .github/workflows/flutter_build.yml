name: nexora - Multi-Platform Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Permite disparar manualmente na aba Actions

jobs:
  # ------------------------------------------------------
  # 1. Android (APK)
  # ------------------------------------------------------
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.8'
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      # --- BUILD ANDROID (APK) ---
      - name: Build do APK
        run: flutter build apk --release

      - name: Renomear APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/nexora.apk

      - name: Upload do Artefato Android
        uses: actions/upload-artifact@v4
        with:
          name: nexora-Android
          path: build/app/outputs/flutter-apk/nexora.apk

  # ------------------------------------------------------
  # 2. Windows Executável & Criador de Instalador .exe
  # ------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.8'
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Build do Windows
        run: flutter build windows --release

      - name: Baixar e Instalar Inno Setup
        run: |
          choco install innosetup -y

      - name: Gerar Instalador EXE (Inno Setup)
        shell: powershell
        run: |
          # Criar script basico do Inno Setup via PowerShell
          $issContent = @"
          [Setup]
          AppName=nexora
          AppVersion=1.0.0
          DefaultDirName={autopf}\nexora
          DefaultGroupName=nexora
          OutputDir=.
          OutputBaseFilename=nexora-Setup
          Compression=lzma
          SolidCompression=yes

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\nexora"; Filename: "{app}\nexora.exe"
          "@
          Set-Content -Path setup.iss -Value $issContent
          ISCC.exe setup.iss

      - name: Upload do Instalador EXE
        uses: actions/upload-artifact@v4
        with:
          name: nexora-Windows-Setup
          path: nexora-Setup.exe

  # ------------------------------------------------------
  # 3. macOS (Criar .dmg) e iOS (Criar .ipa)
  # ------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.8'
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Instalar Ferramenta create-dmg
        run: brew install create-dmg

      # --- BUILD MACOS (.DMG) ---
      - name: Build para macOS
        run: flutter build macos --release

      - name: Criar imagem DMG para macOS
        run: |
          create-dmg \
            --volname "nexora Installer" \
            --volicon "macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_1024.png" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "nexora.app" 200 190 \
            --hide-extension "nexora.app" \
            --app-drop-link 600 190 \
            "nexora.dmg" \
            "build/macos/Build/Products/Release/nexora.app" || true

      # --- BUILD IOS (.IPA) ---
      - name: Build para iOS (Sem assinatura)
        run: flutter build ios --release --no-codesign

      - name: Empacotar estrutura Payload para gerar .IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/nexora.app
          zip -r nexora.ipa Payload

      - name: Upload dos Artefatos Apple
        uses: actions/upload-artifact@v4
        with:
          name: nexora-Apple
          path: |
            nexora.dmg
            nexora.ipa

  # ------------------------------------------------------
  # 4. Linux Desktop & Pacote .deb (Debian / Ubuntu)
  # ------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar dependências de build do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            libasound2-dev \
            libpulse-dev

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.8'
          cache: true

      - name: Habilitar Flutter Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Instalar dependências
        run: flutter pub get

      # --- BUILD LINUX DESKTOP ---
      - name: Build Linux (Release)
        run: flutter build linux --release

      # --- EMPACOTAR DEBIAN (.DEB) ---
      - name: Criar Pacote .deb
        run: |
          mkdir -p deb_pkg/DEBIAN
          mkdir -p deb_pkg/usr/bin
          mkdir -p deb_pkg/usr/lib/nexora
          mkdir -p deb_pkg/usr/share/applications
          mkdir -p deb_pkg/usr/share/icons/hicolor/128x128/apps

          # Copiar o bundle gerado pelo Flutter
          cp -r build/linux/x64/release/bundle/* deb_pkg/usr/lib/nexora/

          # Criar launcher /usr/bin/nexora
          cat << 'EOF' > deb_pkg/usr/bin/nexora
          #!/bin/sh
          exec /usr/lib/nexora/nexora "$@"
          EOF
          chmod +x deb_pkg/usr/bin/nexora
          chmod +x deb_pkg/usr/lib/nexora/nexora

          # Copiar ícone do app
          if [ -f "linux/runner/resources/app_icon.png" ]; then
            cp linux/runner/resources/app_icon.png deb_pkg/usr/share/icons/hicolor/128x128/apps/nexora.png
          fi

          # Criar atalho no menu .desktop
          cat << 'EOF' > deb_pkg/usr/share/applications/nexora.desktop
          [Desktop Entry]
          Name=nexora
          Comment=Mensagens privadas com identidade local e conexão P2P direta.
          Exec=/usr/bin/nexora
          Icon=nexora
          Terminal=false
          Type=Application
          Categories=Network;InstantMessaging;Chat;
          EOF

          # Criar arquivo de controle Debian
          cat << 'EOF' > deb_pkg/DEBIAN/control
          Package: nexora
          Version: 1.0.0
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libsecret-1-0, libjsoncpp25 | libjsoncpp24 | libjsoncpp1
          Maintainer: nexora <support@nexora.chat>
          Description: nexora - Mensagens privadas com identidade local e conexão P2P direta.
          EOF

          # Construir pacote .deb com dpkg-deb
          dpkg-deb --build deb_pkg nexora.deb

      - name: Upload do Artefato Linux (.deb)
        uses: actions/upload-artifact@v4
        with:
          name: nexora-Linux-Deb
          path: nexora.deb

  # ------------------------------------------------------
  # 5. Job Unificado de Publicação nas Releases
  # ------------------------------------------------------
  publish-release:
    needs: [build-ubuntu, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar todos os artefatos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organizar arquivos com nome nexora
        run: |
          mkdir -p release_assets
          cp artifacts/nexora-Android/nexora.apk release_assets/nexora.apk || true
          cp artifacts/nexora-Windows-Setup/nexora-Setup.exe release_assets/nexora-Setup.exe || true
          cp artifacts/nexora-Apple/nexora.dmg release_assets/nexora.dmg || true
          cp artifacts/nexora-Apple/nexora.ipa release_assets/nexora.ipa || true
          cp artifacts/nexora-Linux-Deb/nexora.deb release_assets/nexora.deb || true

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: "nexora ${{ github.ref_name || 'v1.0.0' }} - Release"
          files: release_assets/*
          generate_release_notes: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

