name: nexora
description: "Mensagens privadas com identidade local e conexão P2P direta."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: 13.2.0
  uuid: ^4.6.0
  cryptography: ^2.9.0
  cupertino_icons: ^1.0.8
  shared_preferences: 2.5.6
  flutter_webrtc: ^1.6.2+hotfix.4
  flutter_secure_storage: ^11.2.0
  image: ^4.10.1
  mobile_scanner: ^7.5.0
  qr: ^3.0.3
  zxing2: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  image_path: assets/icon.png
  android: true
  adaptive_icon_background: "#0D1220"
  adaptive_icon_foreground: assets/icon.png
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#0D1220"
  windows:
    generate: true
    image_path: assets/icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon.png
